<text x="1140" y="670" text-anchor="end" font-size="13">NOT TO SCALE</text>
<rect x="42" y="687" width="1116" height="121" rx="14" fill="#eef4f9"/>
<text x="63" y="717" class="dark" font-size="19" font-weight="bold">HOW IT WORKS</text>
<text x="63" y="745" class="dark" font-size="17">Each fabric tape carries a row of shaped teeth. Moving the slider upward along the tapes closes the zipper:</text>
<text x="63" y="770" class="dark" font-size="17">its Y-shaped channel guides the two separate rows together so their teeth interlock. Moving the slider</text>
<text x="63" y="796" class="dark" font-size="17">downward reverses that path and separates the rows. This drawing is simplified and not to scale.</text></svg>