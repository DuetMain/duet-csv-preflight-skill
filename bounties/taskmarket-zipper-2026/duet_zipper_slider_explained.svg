<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="ttl desc">
<title id="ttl">The tiny junction inside a zipper - original explainer</title>
<desc id="desc">An open-to-closed zipper and enlarged Y-channel showing separate left and right teeth joining into a meshed chain. Upward slider motion closes; downward motion opens. Simplified and not to scale.</desc>
<metadata>Original schematic, Duet, October 2026. Manufacturer source https://www.ykk.com/english/ykk/tech/01.html establishes tapes, meshing elements, slider, Y-shaped tunnel, closing up/opening down. Patent source https://patents.google.com/patent/US20120042433A1/en describes the Y-shaped channel and interlocking engagement. No source artwork or prose copied.</metadata>
