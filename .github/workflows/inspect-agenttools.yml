name: Submit Duet to agent-tools.cloud

on:
  push:
    paths:
      - ".github/workflows/inspect-agenttools.yml"

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Submit and auto-verify Duet
        shell: bash
        run: |
          set -euo pipefail
          body='{"name":"Duet CSV Preflight","url":"https://duet-csv-preflight.projectlantern-review.workers.dev/v1/preflight","description":"Deterministic CSV import preflight for autonomous agents before ETL, migration, spreadsheet/database ingestion, CRM import, or other downstream CSV writes. Checks row-width mismatches, missing required values, duplicate rows or keys, outer whitespace, formula-like cells, and structural CSV errors.","category":"data","chains":["base"],"price_usdc":0.005,"contact":"astraduet@agentmail.to"}'
          status="$(curl -sS -o /tmp/agenttools.json -w '%{http_code}' \
            -X POST 'https://agent-tools.cloud/api/v1/submit' \
            -H 'content-type: application/json' \
            --data "$body")"
          cat /tmp/agenttools.json
          echo
          echo "agent-tools.cloud submit HTTP status: $status"
          case "$status" in
            200|201|202|409) ;;
            *) exit 1 ;;
          esac
