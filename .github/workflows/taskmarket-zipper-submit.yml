name: Submit Duet zipper bounty (signed, no secrets)
on:
  push:
    paths:
      - 'bounties/taskmarket-zipper-2026/**'
      - '.github/workflows/taskmarket-zipper-submit.yml'
  workflow_dispatch:
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Independently verify the submitted public signature
        run: |
          npm install --no-save --silent ethers@6
          node - <<'JS'
          const {verifyMessage}=require('ethers');
          const task='0x30a3d7666614a356ae2a149159d604a7e12a4454e32ac25b65b6823a17d3e524';
          const sig='0x9f324345c252d10165379e2db987f5a18ea409ccf820f21c9aefbfd62595493a512f4cabadc579470bb98b133b593b5873ad70ed72a87eb556baf75aeebe7cdd1c';
          const addr=verifyMessage('taskmarket:submit:'+task,sig);
          console.log('Ethers recovered address:',addr);
          JS
      - name: Verify task still open and submit once
        env:
          TASK_ID: "0x30a3d7666614a356ae2a149159d604a7e12a4454e32ac25b65b6823a17d3e524"
          WORKER: "0xc6ce5965872f6d1813b276955b8a6e7517f8bf78"
          SIGNATURE: "0x9f324345c252d10165379e2db987f5a18ea409ccf820f21c9aefbfd62595493a512f4cabadc579470bb98b133b593b5873ad70ed72a87eb556baf75aeebe7cdd1c"
        run: |
          python3 - <<'PY'
          import os,base64,json,urllib.request,urllib.error,sys
          task=os.environ['TASK_ID']
          who=os.environ['WORKER']
          base='https://api.taskmarket.dev'
          def request(url,body=None):
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(base+url,data=data,headers={'Accept':'application/json','Content-Type':'application/json'},method='GET' if data is None else 'POST')
              with urllib.request.urlopen(req, timeout=35) as resp:
                  return json.loads(resp.read().decode())
          try:
              task_info=request('/api/tasks/'+task)
              status=task_info.get('status') or task_info.get('task',{}).get('status')
              print('Task status:', status)
              if status!='open':
                  raise RuntimeError('Task no longer open')
              previous=request('/api/submissions/mine?workerAddress='+who)
              rows=previous if isinstance(previous,list) else previous.get('submissions',previous.get('data',[]))
              if any(t.get('taskId','').lower()==task.lower() for t in rows):
                  print('Existing submission found; refusing duplicate')
                  sys.exit(0)
              file_path='bounties/taskmarket-zipper-2026/duet_zipper_slider_explained.svg'
              data=open(file_path,'rb').read()
              assert len(data)<500000
              payload={'taskId':task,'workerAddress':who,'signature':os.environ['SIGNATURE'],'artifacts':[{'fileName':'duet_zipper_slider_explained.svg','mimeType':'image/svg+xml','role':'final','file':base64.b64encode(data).decode()}]}
              result=request('/api/tasks/'+task+'/submissions',payload)
              print('Submission result:',json.dumps(result))
              if not result.get('success'):
                  raise RuntimeError('API did not confirm success')
          except urllib.error.HTTPError as e:
              print('HTTP failure',e.code, e.read().decode()[:3000])
              sys.exit(1)
          except Exception as e:
              print('Submission failed:',str(e));sys.exit(1)
          PY
