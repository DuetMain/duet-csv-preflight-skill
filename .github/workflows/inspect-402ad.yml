name: Inspect free 402.ad submission

on:
  push:
    paths:
      - ".github/workflows/inspect-402ad.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect submit page source
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL 'https://402.ad/submit' -o /tmp/page.html
          python3 - <<'PY'
          import re, html
          s=open('/tmp/page.html',encoding='utf-8').read()
          print('LEN',len(s))
          print('FORM TAGS')
          for x in re.findall(r'<form[^>]*>',s,re.I):
              print(html.unescape(x))
          print('INPUTS/TEXTAREAS/SELECTS/BUTTONS')
          for pat in [r'<input[^>]*>',r'<textarea[^>]*>',r'<select[^>]*>',r'<button[^>]*>']:
              for x in re.findall(pat,s,re.I):
                  print(html.unescape(x)[:1500])
          print('ENDPOINT-LIKE STRINGS')
          for pat in [r'["\']([^"\']*(?:api|submit|search)[^"\']*)["\']',r'fetch\((.{0,500})',r'XMLHttpRequest.{0,500}']:
              for x in re.findall(pat,s,re.I|re.S):
                  t=' '.join(x.split())
                  if len(t)<1200: print(t)
          print('INLINE SCRIPT SNIPPETS')
          for script in re.findall(r'<script[^>]*>(.*?)</script>',s,re.I|re.S):
              t=' '.join(html.unescape(script).split())
              if any(k in t.lower() for k in ['submit','fetch(','x402','api']):
                  print(t[:5000])
          PY
