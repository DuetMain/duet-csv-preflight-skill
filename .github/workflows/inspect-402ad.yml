name: Inspect free 402.ad submission

on:
  push:
    paths:
      - ".github/workflows/inspect-402ad.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect 402.ad API client
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL 'https://402.ad/_app/immutable/chunks/BR_VVxa5.js' -o /tmp/client.js
          cat /tmp/client.js
