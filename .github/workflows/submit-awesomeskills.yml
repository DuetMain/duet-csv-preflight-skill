name: Submit Duet to Awesome Skills

on:
  push:
    paths:
      - ".github/workflows/submit-awesomeskills.yml"

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Submit canonical skill path
        shell: bash
        run: |
          set -u
          body='{"url":"https://github.com/DuetMain/duet-csv-preflight-skill/tree/main/skills/duet-csv-preflight"}'
          status="$(curl -sS -o /tmp/submit.json -w '%{http_code}' \
            -X POST 'https://www.awesomeskills.dev/api/v1/submit' \
            -H 'content-type: application/json' \
            --data "$body")"
          cat /tmp/submit.json
          echo
          echo "Awesome Skills submit HTTP status: $status"
          case "$status" in
            200|201|202|409) exit 0 ;;
            400|401|403) echo "Human verification or validation required; stop without retrying." ; exit 0 ;;
            *) exit 1 ;;
          esac
