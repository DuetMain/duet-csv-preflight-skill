name: Submit Duet to Awesome Skills

on:
  push:
    paths:
      - ".github/workflows/submit-awesomeskills.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect submission client
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL 'https://www.awesomeskills.dev/en/submit' -o /tmp/page.html
          python3 - <<'PY'
          import re
          s=open('/tmp/page.html',encoding='utf-8').read()
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)',s,re.I)
          open('/tmp/srcs','w').write('\n'.join(srcs))
          print('\n'.join(srcs))
          PY
          : > /tmp/all.js
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            case "$p" in http*) u="$p";; /*) u="https://www.awesomeskills.dev$p";; *) u="https://www.awesomeskills.dev/$p";; esac
            curl -sSL "$u" >> /tmp/all.js || true
            printf '\n' >> /tmp/all.js
          done < /tmp/srcs
          python3 - <<'PY'
          import re
          s=open('/tmp/all.js',encoding='utf-8',errors='ignore').read()
          for key in ['SubmitForm','fetch(','/api/','submit','githubUrl','repoUrl','repository']:
              print('\nKEY',key)
              n=0
              for m in re.finditer(re.escape(key),s,re.I):
                  print(' '.join(s[max(0,m.start()-700):m.end()+1600].split())[:3000])
                  n+=1
                  if n>=5: break
          PY
