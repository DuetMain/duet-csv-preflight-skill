name: Submit Taskmarket bounty via official CLI (secure backup)
on:
  push:
    paths:
      - '.github/workflows/taskmarket-cli-zipper.yml'
  workflow_dispatch:
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install official Taskmarket CLI
        run: npm install -g @lucid-agents/taskmarket@latest
      - name: Create self-custodial wallet and inspect participation status
        run: |
          taskmarket init
          taskmarket address
          taskmarket legal status
      - name: Submit original work without paid actions or accepting legal terms
        run: |
          taskmarket task get 0x30a3d7666614a356ae2a149159d604a7e12a4454e32ac25b65b6823a17d3e524
          taskmarket task submit 0x30a3d7666614a356ae2a149159d604a7e12a4454e32ac25b65b6823a17d3e524 --file bounties/taskmarket-zipper-2026/duet_zipper_slider_explained.svg
      - name: Encrypt generated wallet for recovery using operator-only RSA key
        if: always()
        run: |
          python3 -m pip install --user --quiet cryptography
          python3 - <<'PY'
          import os,tarfile,io,base64,json,secrets
          from pathlib import Path
          from cryptography.hazmat.primitives.serialization import load_pem_public_key
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          home=Path.home()/'.taskmarket'
          if not home.exists():
              print('No taskmarket wallet directory to back up')
              raise SystemExit(0)
          output=io.BytesIO()
          with tarfile.open(fileobj=output,mode='w:gz') as tar:
              tar.add(home,arcname='.taskmarket')
          pub=load_pem_public_key(Path('bounties/taskmarket-zipper-2026/recovery-public.pem').read_bytes())
          aes_key=AESGCM.generate_key(bit_length=256)
          nonce=secrets.token_bytes(12)
          ciphertext=AESGCM(aes_key).encrypt(nonce,output.getvalue(),b'Duet Taskmarket wallet backup v1')
          wrapped=pub.encrypt(aes_key,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          rec={'version':1,'algorithm':'AES-256-GCM + RSA-3072-OAEP-SHA256','rsa_wrapped_aes_key':base64.b64encode(wrapped).decode(),'nonce':base64.b64encode(nonce).decode(),'ciphertext':base64.b64encode(ciphertext).decode()}
          Path('duet-taskmarket-wallet-encrypted.json').write_text(json.dumps(rec))
          print('Encrypted private wallet backup created; no private key printed')
          PY
      - name: Save encrypted wallet backup for owner
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duet-taskmarket-wallet-encrypted
          path: duet-taskmarket-wallet-encrypted.json
          if-no-files-found: warn
          retention-days: 30
