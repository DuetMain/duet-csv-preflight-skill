name: Verify Duet external state

on:
  push:
    paths:
      - ".github/workflows/verify-duet-state.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public Base receipts without spending
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const wallet='0xa9a52a066e342e2ED2488BBdb9fAd95EFd3D9FD4';
          const usdc='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913';
          const topicWallet='0x'+wallet.slice(2).toLowerCase().padStart(64,'0');
          const transferTopic='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef';
          let id=0;
          async function rpc(method,params){
            await new Promise(resolve=>setTimeout(resolve,1200));
            const response=await fetch('https://base.drpc.org',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:++id,method,params}),signal:AbortSignal.timeout(20000)});
            if(!response.ok) throw Error('RPC HTTP '+response.status+' '+(await response.text()).slice(0,500));
            const data=await response.json();
            if(data.error) throw Error(JSON.stringify(data.error));
            if(!Object.hasOwn(data,'result')) throw Error('RPC result missing');
            return data.result;
          }
          const evidence={checkedAt:new Date().toISOString(),wallet,asset:usdc,receiptStatus:'UNKNOWN',spendUsd:0};
          try{
            const chainId=await rpc('eth_chainId',[]);
            if(chainId!=='0x2105')throw Error('Unexpected network '+chainId);
            evidence.chainId=chainId;
            evidence.rpc='https://base.drpc.org';
            const latest=await rpc('eth_blockNumber',[]);
            evidence.toBlock=latest;
            const balance=await rpc('eth_call',[{to:usdc,data:'0x70a08231'+topicWallet.slice(2)},latest]);
            evidence.balanceAtomic=BigInt(balance).toString();
            const known=await rpc('eth_getTransactionReceipt',['0xa83d13104d45e00b60f7f846e7b750edd8d243ea68101c6d0390c22e762a6256']);
            evidence.marketplaceVerificationReceipt=known;
            const fromBlock='0x'+(51700000).toString(16);
            evidence.fromBlock=fromBlock;
            const logs=[];
            for(let start=51700000;start<=Number(BigInt(latest));start+=10000){
              const end=Math.min(start+9999,Number(BigInt(latest)));
              const page=await rpc('eth_getLogs',[{address:usdc,topics:[transferTopic,null,topicWallet],fromBlock:'0x'+start.toString(16),toBlock:'0x'+end.toString(16)}]);
              if(!Array.isArray(page)) throw Error('Logs response is not an array');
              logs.push(...page);
              evidence.lastCompleteBlock='0x'+end.toString(16);
              if(page.length)console.log(JSON.stringify({partialInbound:page}));
            }
            evidence.receiptStatus='COMPLETE_FOR_BLOCK_RANGE';
            evidence.inbound=logs.map(log=>({tx:log.transactionHash,block:log.blockNumber,logIndex:log.logIndex,removed:log.removed,from:'0x'+log.topics[1].slice(-40),to:'0x'+log.topics[2].slice(-40),atomic:BigInt(log.data).toString()}));
            evidence.transactionReceipts=[];
            for(const tx of [...new Set(evidence.inbound.map(x=>x.tx))]){
              evidence.transactionReceipts.push(await rpc('eth_getTransactionReceipt',[tx]));
            }
          }catch(error){evidence.reason=String(error);}
          console.log(JSON.stringify(evidence));
          if(evidence.receiptStatus==='UNKNOWN')process.exitCode=1;
          JS

      - name: Verify agent-tools.cloud public card
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl -sS 'https://agent-tools.cloud/api/v1/services/duet-csv-preflight-projectlantern-review-workers-dev-sub983' | python3 -m json.tool || true

      - name: Verify Awesome Skills public page
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for u in \
            'https://www.awesomeskills.dev/en/skill/duet-csv-preflight-skill-duet-csv-preflight' \
            'https://www.awesomeskills.dev/skill/duet-csv-preflight-skill-duet-csv-preflight'; do
            code="$(curl -sSL -o /tmp/skillpage -w '%{http_code}' "$u")"
            echo "URL $u HTTP $code"
            if [ "$code" = "200" ]; then
              python3 - <<'PY'
          import re
          s=open('/tmp/skillpage',encoding='utf-8',errors='ignore').read()
          for needle in ['duet-csv-preflight','Duet CSV Preflight']:
              print(needle, needle.lower() in s.lower())
          print(re.sub(r'<[^>]+>',' ',s)[:1200])
          PY
            fi
          done

      - name: Check Agent402 indexed seller
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl -sS 'https://agent402.tools/api/index?seller=duet-csv-preflight.projectlantern-review.workers.dev' -o /tmp/agent402.json
          python3 -m json.tool /tmp/agent402.json || cat /tmp/agent402.json

      - name: Check Market402 operator state
        if: always()
        shell: bash
        run: |
          set -u
          for u in \
            'https://market402.com/badge/duet-csv-preflight.projectlantern-review.workers.dev' \
            'https://market402.com/op/duet-csv-preflight.projectlantern-review.workers.dev.json' \
            'https://market402.com/op/duet-csv-preflight.projectlantern-review.workers.dev'; do
            code="$(curl -sSL -o /tmp/m402 -w '%{http_code}' "$u")"
            echo "URL $u HTTP $code"
            head -c 5000 /tmp/m402
            echo
          done

      - name: Verify migrated API using the buyer adapter's Node runtime, without payment
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const root='https://duet-csv-preflight.timbeaux-sora.chatgpt.site';
          const results={};
          for (const path of ['/health','/openapi.json','/.well-known/x402','/v1/preflight/sample']){
            const response=await fetch(root+path);
            const raw=await response.text();
            console.log(JSON.stringify({path,status:response.status,body:raw}));
            assert.equal(response.status,200);
            results[path]=JSON.parse(raw);
          }
          assert.equal(results['/health'].version,'0.1.2');
          assert.equal(results['/openapi.json'].servers[0].url,root);
          assert.equal(results['/.well-known/x402'].resources[0].url,root+'/v1/preflight');
          const sample=results['/v1/preflight/sample'].result;
          assert.equal(sample.summary.dataRecords,3);
          assert.equal(sample.summary.columns,2);
          assert.equal(sample.counts.KEY_DUPLICATE,1);
          assert.equal(sample.counts.FORMULA,1);
          assert.equal(sample.importReady,false);
          const response=await fetch(root+'/v1/preflight',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({csv:'id,name\\n1,Alice\\n',requiredFields:['id'],keyField:'id'})});
          console.log(JSON.stringify({path:'/v1/preflight',status:response.status,body:await response.text()}));
          assert.equal(response.status,402);
          const challenge=JSON.parse(Buffer.from(response.headers.get('PAYMENT-REQUIRED'),'base64').toString());
          assert.equal(challenge.x402Version,2);
          assert.equal(challenge.resource.url,root+'/v1/preflight');
          const accept=challenge.accepts[0];
          assert.equal(accept.amount,'5000');
          assert.equal(accept.network,'eip155:8453');
          assert.equal(accept.payTo,'0xa9a52a066e342e2ED2488BBdb9fAd95EFd3D9FD4');
          assert.equal(accept.asset,'0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913');
          console.log(JSON.stringify({verification:'PASS_UNPAID_ONLY',paymentRequired:challenge}));
          JS

      - name: Inspect newly indexed independent origin
        if: always()
        shell: bash
        run: |
          curl -sS 'https://agent402.tools/api/index?seller=duet-csv-preflight.timbeaux-sora.chatgpt.site' | python3 -m json.tool
