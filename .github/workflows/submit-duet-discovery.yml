name: Submit Duet discovery listings

on:
  push:
    paths:
      - ".github/workflows/submit-duet-discovery.yml"

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record SkillsMD intake blocker
        shell: bash
        run: |
          echo "SkillsMD POST /api/submit was tried against the valid public repo."
          echo "It returned 404: GitHub repo not found. Do not retry automatically."

      - name: Register Duet origin with x402scan public registration flow
        shell: bash
        run: |
          set -euo pipefail
          body='{"0":{"json":{"origin":"https://duet-csv-preflight.projectlantern-review.workers.dev"}}}'
          status="$(curl -sS -o /tmp/x402scan.json -w '%{http_code}' \
            -X POST 'https://www.x402scan.com/api/trpc/public.resources.registerFromOrigin?batch=1' \
            -H 'content-type: application/json' \
            -H 'x-trpc-source: nextjs-react' \
            --data "$body")"
          cat /tmp/x402scan.json
          echo
          echo "x402scan HTTP status: $status"
          test "$status" = "200"
          python3 - <<'PY'
          import json
          with open("/tmp/x402scan.json", "r", encoding="utf-8") as f:
              data=json.load(f)
          if not isinstance(data, list) or not data:
              raise SystemExit("Unexpected x402scan tRPC response shape")
          item=data[0]
          if "error" in item:
              raise SystemExit(f"x402scan tRPC error: {item['error']}")
          payload=(item.get("result") or {}).get("data") or {}
          payload=payload.get("json", payload)
          if payload.get("success") is not True:
              raise SystemExit(f"x402scan registration did not report success: {payload}")
          print("x402scan registration:", {
              "registered": payload.get("registered"),
              "failed": payload.get("failed"),
              "skipped": payload.get("skipped"),
              "originId": payload.get("originId"),
          })
          PY

      - name: Record A2A List compatibility blocker
        shell: bash
        run: |
          echo "A2A List public JSON-RPC intake currently fails server-side because its submissions table lacks submitted_ip."
          echo "Its documented API-key fallback was also tested without exposing the generated key."
          echo "That fallback rejected Duet because its verifier GETs the POST-only endpoint and receives HTTP 405 instead of 402."
          echo "Do not retry automatically or weaken Duet's POST semantics only to satisfy this directory."
